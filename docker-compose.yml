# Levanta todo el proyecto: `docker compose up`
#   web    → http://localhost:5173 (sitio público + su API)
#   panel  → http://localhost:5180/admin (panel del estudio + su API), servicio aparte
#   db     → PostgreSQL (puerto del host: ${DB_PORT:-5440})
#   umami  → analítica de visitas, http://localhost:${UMAMI_PORT:-3100} (su propia base: umami-db)
name: hathor-frequency

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-hathor}:${POSTGRES_PASSWORD:-hathor}@db:5432/${POSTGRES_DB:-hathor_frequency}?schema=public
  PRISMA_HIDE_UPDATE_MESSAGE: "1"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hathor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hathor}
      POSTGRES_DB: ${POSTGRES_DB:-hathor_frequency}
    ports:
      - "${DB_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Prepara el código una vez antes de arrancar web y panel: dependencias, cliente Prisma y migraciones.
  # Así los dos servicios no compiten por instalar o migrar a la vez.
  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      HF_SETUP: "1"
    command: ["true"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Web pública: Vite :5173 + API pública (server/web) en :3000 dentro del contenedor
  web:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      # Medios (fotos/videos) en un disco aparte, montado abajo y servido en /media
      MEDIA_DIR: /app/media
      # Umami: Vite le pasa /umami (script y envíos de visitas)
      UMAMI_PROXY_TARGET: http://umami:3000
    command: ["npm", "run", "dev:web-all"]
    ports:
      - "${APP_PORT:-5173}:5173"
    volumes: &app-volumes
      - .:/app
      - node_modules:/app/node_modules
      # Ruta del HDD de medios en el host (MEDIA_DIR en .env); por defecto ./media
      - ${MEDIA_DIR:-./media}:/app/media:ro

  # Panel del estudio: Vite :5180 + API del panel (server/panel) en :3001 dentro del contenedor.
  # Se puede detener o reiniciar sin tocar la web: `docker compose stop panel`
  panel:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      MEDIA_DIR: /app/media
      # La API del panel lee las cifras de visitas para el dashboard
      UMAMI_URL: http://umami:3000
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_USERNAME: ${UMAMI_USERNAME:-admin}
      UMAMI_PASSWORD: ${UMAMI_PASSWORD:-umami}
    command: ["npm", "run", "dev:panel-all"]
    ports:
      - "${PANEL_PORT:-5180}:5180"
    volumes: *app-volumes

  # Analítica de visitas sin cookies (dashboard del panel · Visitas)
  umami-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
      POSTGRES_DB: umami
    volumes:
      - umamidata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-hathor-dev-umami-secret}
    ports:
      - "${UMAMI_PORT:-3100}:3000"

volumes:
  pgdata:
  node_modules:
  umamidata:
